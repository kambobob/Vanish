# Players with this permission count as "staff" for %vanish_staffonline%.
staff-permission: vanish.use

# Broadcast a fake "left the game" / "joined the game" message when someone vanishes or unvanishes.
fake-messages: true

# Private message commands that act as if a vanished player is offline.
blocked-commands:
  - msg
  - tell
  - w
  - whisper
  - m
  - t
  - pm

# What happens when a vanished player hits something:
#   players - hitting another player makes you visible again (default)
#   all     - hitting any entity (mobs too) makes you visible again
#   off     - vanished players stay vanished when they attack
unvanish-on-hit: players
